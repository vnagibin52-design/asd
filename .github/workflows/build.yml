name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-x64-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-x64-${{ runner.os }}-

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\downloads
          key: vcpkg-downloads-${{ runner.os }}
          
      - name: Install Boost via vcpkg
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          & "C:\vcpkg\vcpkg.exe" install boost:x64-windows
        shell: pwsh

      - name: Configure with CMake
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          cmake -B build `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
        shell: pwsh

      - name: Build with CMake
        run: cmake --build build --config Release
        shell: pwsh

      # Копируем нужные DLL из vcpkg рядом с exe — чтобы артефакт работал сразу после распаковки
      - name: Copy Boost DLLs next to executables
        run: |
          $boostBin = "C:\vcpkg\installed\x64-windows\bin"
          $buildDir = "build\Release"
          Copy-Item "$boostBin\boost_unit_test_framework*.dll" -Destination $buildDir -Force
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/Release/
          retention-days: 7

