name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Clone vcpkg
      - name: Clone vcpkg (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          if not exist C:\vcpkg git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
        shell: cmd

      - name: Clone vcpkg (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ ! -d "$HOME/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git $HOME/vcpkg
          fi
        shell: bash

      # Bootstrap vcpkg
      - name: Bootstrap vcpkg (Windows)
        if: matrix.os == 'windows-latest'
        run: C:\vcpkg\bootstrap-vcpkg.bat
        shell: cmd

      - name: Bootstrap vcpkg (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: $HOME/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      # Windows: MSVC
      - name: Setup MSVC environment (Windows only)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # Cache vcpkg
      - name: Cache vcpkg binary archives and downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.os == 'windows-latest' && 'C:\Users\runneradmin\AppData\Local\vcpkg\archives' || '/home/runner/.cache/vcpkg/archives' }}
            ${{ matrix.os == 'windows-latest' && 'C:\vcpkg\downloads' || '/home/runner/vcpkg\downloads' }}
          key: vcpkg-boost-${{ matrix.os }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-boost-${{ matrix.os }}-

      # Linux: build tools for libb2
      - name: Install build tools for libb2 (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool
        shell: bash

      # Install Boost
      - name: Install Boost via vcpkg (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          & "C:\vcpkg\vcpkg.exe" install boost:x64-windows
        shell: pwsh

      - name: Install Boost via vcpkg (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          export VCPKG_ROOT="$HOME/vcpkg"
          "$HOME/vcpkg/vcpkg" install boost:x64-linux
        shell: bash

      # Configure
      - name: Configure with CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          cmake -B build `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
        shell: pwsh

      - name: Configure with CMake (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          export VCPKG_ROOT="$HOME/vcpkg"
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake"
        shell: bash

      # Build
      - name: Build with CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake --build build --config Release
        shell: pwsh

      - name: Build with CMake (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cmake --build build
        shell: bash

      # Copy Boost DLLs next to executables (Windows only) — чтобы в релизе сразу всё работало
      - name: Copy Boost DLLs (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          $boostBin = "C:\vcpkg\installed\x64-windows\bin"
          $buildDir = "build\Release"
          Copy-Item "$boostBin\boost_unit_test_framework*.dll" -Destination $buildDir -Force
        shell: pwsh

      # Create release artifacts via cmake --install
      - name: Create release artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          export VCPKG_ROOT="$HOME/vcpkg"
          mkdir -p release
          cmake --install build --prefix ./release
        shell: bash

      - name: Create release artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          New-Item -ItemType Directory -Force -Path C:\release
          cmake --install build --config Release --prefix C:\release
        shell: pwsh

      # Upload clean release artifacts (только bin и lib, без CMake-кэшей)
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-release
          path: ${{ matrix.os == 'windows-latest' && 'C:\\release' || './release' }}
          retention-days: 7